# PR titles become the squash commit on `develop`, and semantic-release reads them to pick the next version
# (scripts/release-version.ts). Format: `<Tag>: <Short description>`, plus ` (#123)` / ` (#123, #456)` (ascending) at the end when the PR closes issues. Own workflow so a title edit doesn't re-run local-ci.
name: PR title

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            Breaking
            Fix
            Update
            New
            Docs
            Build
            Upgrade
            Chore
          requireScope: false
          headerPattern: '^(\w+): (.+)$'
          headerPatternCorrespondence: type, subject
      - uses: actions/github-script@v7
        with:
          script: |
            const query = `query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 50) { nodes { number } }
                }
              }
            }`;
            const { repository } = await github.graphql(query, {
              ...context.repo,
              number: context.payload.pull_request.number,
            });
            const numbers = repository.pullRequest.closingIssuesReferences.nodes
              .map((n) => n.number)
              .sort((a, b) => a - b);
            if (numbers.length === 0) return;
            const suffix = `(#${numbers.join(', #')})`;
            const title = context.payload.pull_request.title.trim();
            if (!title.endsWith(` ${suffix}`)) {
              core.setFailed(
                `PR closes ${numbers.map((n) => `#${n}`).join(', ')}, so the title must end with " ${suffix}". ` +
                  `GitHub appends (#<PR number>) itself on squash.`,
              );
            }
