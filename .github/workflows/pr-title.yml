# PR titles become the squash commit on `develop`, and semantic-release reads them to pick the next version
# (scripts/release-version.ts).
# Format: `<Tag>: <Short description>`, plus ` (#123)` / ` (#123, #456)` (ascending) at the end when the PR
# closes issues of this repo.
# Own workflow so a title edit doesn't re-run local-ci.
name: PR title

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            Breaking
            Fix
            Update
            New
            Docs
            Build
            Upgrade
            Chore
          requireScope: false
          headerPattern: '^(\w+): (.+)$'
          headerPatternCorrespondence: type, subject
      - uses: actions/github-script@v7
        if: ${{ !cancelled() }}
        with:
          script: |
            const query = `query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 50) { nodes { number repository { nameWithOwner } } }
                }
              }
            }`;
            const { repository } = await github.graphql(query, {
              ...context.repo,
              number: context.payload.pull_request.number,
            });
            const thisRepo = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const numbers = repository.pullRequest.closingIssuesReferences.nodes
              .filter((node) => node.repository.nameWithOwner.toLowerCase() === thisRepo)
              .map((node) => node.number)
              .sort((a, b) => a - b);
            if (numbers.length === 0) return;
            const refs = numbers.map((n) => `#${n}`);
            const suffix = `(${refs.join(', ')})`;
            const title = context.payload.pull_request.title.trim();
            if (!title.endsWith(` ${suffix}`)) {
              core.setFailed(
                `PR closes ${refs.join(', ')}, so the title must end with " ${suffix}". ` +
                  `GitHub appends (#<PR number>) itself on squash.`,
              );
            }
