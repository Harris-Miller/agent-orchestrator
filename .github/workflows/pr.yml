name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            tsconfig.tsbuildinfo
            apps/*/*.tsbuildinfo
            libs/*/*.tsbuildinfo
            tooling/*/*.tsbuildinfo
          key: turbo-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-
            turbo-${{ runner.os }}-

      - run: pnpm run local-ci

      # this is here so local-ci fails if `pnpm run build` on `apps/website` fails to prevent PR merging
      # the output directories are not part of the cache, nor do I want it to be
      - run: pnpm --filter=@apps/website run build
