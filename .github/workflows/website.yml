# PROTOTYPE (#435) — builds all three website variants into one Pages site:
#   https://<owner>.github.io/<repo>/      → variant index
#   https://<owner>.github.io/<repo>/a|b|c/ → each variant (with the variant switcher)
# Manual only while the variants are being compared. Requires Settings › Pages › Source: GitHub Actions.
name: Website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5

      - run: pnpm --filter=@apps/website run build
        env:
          WEBSITE_BASE: /${{ github.event.repository.name }}/
          WEBSITE_PROTOTYPE: '1'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
