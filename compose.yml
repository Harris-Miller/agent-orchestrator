services:
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: agent-orchestrator-otel-lgtm
    ports:
      - '3000:3000' # Grafana UI
      - '3200:3200' # Tempo (HTTP MCP at /api/mcp)
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
      - '13133:13133' # OTel Collector health_check
    environment:
      TEMPO_EXTRA_ARGS: '--query-frontend.mcp-server.enabled=true'
    volumes:
      - otel-lgtm-data:/data
    restart: unless-stopped

volumes:
  otel-lgtm-data:
