<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HOA logo candidates</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: #0d0d10;
        color: #e8e8ee;
        font:
          15px/1.4 system-ui,
          sans-serif;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 24px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 24px;
      }
      figure {
        margin: 0;
      }
      img {
        width: 100%;
        display: block;
      }
      figcaption {
        margin-top: 8px;
      }
      figcaption small {
        display: block;
        color: #9a9aa6;
      }
      .sizes {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        margin-top: 8px;
      }
      .sizes img {
        width: auto;
      }
    </style>
  </head>
  <body>
    <h1>Harness Orchestrating Agents — logo candidates</h1>
    <div class="grid">
      <figure>
        <img src="hoa-arc-monogram.svg" alt="" />
        <figcaption>
          1 · Arc monogram<small>cyan + amber, from the original Arc Monogram</small>
          <div class="sizes">
            <img src="hoa-arc-monogram.svg" width="64" alt="" /><img src="hoa-arc-monogram.svg" width="32" alt="" /><img
              src="hoa-arc-monogram.svg"
              width="16"
              alt=""
            />
          </div>
        </figcaption>
      </figure>
      <figure>
        <img src="hoa-shapes.svg" alt="" />
        <figcaption>
          2 · Geometric shapes<small>mint on forest, from Geometric Agents</small>
          <div class="sizes">
            <img src="hoa-shapes.svg" width="64" alt="" /><img src="hoa-shapes.svg" width="32" alt="" /><img
              src="hoa-shapes.svg"
              width="16"
              alt=""
            />
          </div>
        </figcaption>
      </figure>
      <figure>
        <img src="hoa-orbit.svg" alt="" />
        <figcaption>
          3 · Orbit<small>linked circled letters, from Network Monogram</small>
          <div class="sizes">
            <img src="hoa-orbit.svg" width="64" alt="" /><img src="hoa-orbit.svg" width="32" alt="" /><img
              src="hoa-orbit.svg"
              width="16"
              alt=""
            />
          </div>
        </figcaption>
      </figure>
      <figure>
        <img src="hoa-glow-wordmark.svg" alt="" />
        <figcaption>
          4 · Glow wordmark<small>lowercase "hoa", from Teal Wordmark</small>
          <div class="sizes">
            <img src="hoa-glow-wordmark.svg" width="64" alt="" /><img
              src="hoa-glow-wordmark.svg"
              width="32"
              alt=""
            /><img src="hoa-glow-wordmark.svg" width="16" alt="" />
          </div>
        </figcaption>
      </figure>
      <figure>
        <img src="hoa-cycle.svg" alt="" />
        <figcaption>
          5 · Cycle<small>bold type, O as a sync ring, from Condensed Type</small>
          <div class="sizes">
            <img src="hoa-cycle.svg" width="64" alt="" /><img src="hoa-cycle.svg" width="32" alt="" /><img
              src="hoa-cycle.svg"
              width="16"
              alt=""
            />
          </div>
        </figcaption>
      </figure>
      <figure>
        <img src="hoa-house.svg" alt="" />
        <figcaption>
          6 · House<small>roof = A, ring = O, H = walls; leans into "The HOA"</small>
          <div class="sizes">
            <img src="hoa-house.svg" width="64" alt="" /><img src="hoa-house.svg" width="32" alt="" /><img
              src="hoa-house.svg"
              width="16"
              alt=""
            />
          </div>
        </figcaption>
      </figure>
    </div>
  </body>
</html>
